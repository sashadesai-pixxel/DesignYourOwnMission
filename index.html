:root{
  --bg:#000000; --panel:#0a0d16; --ink:#f2f6fc; --muted:#9aa8c2; --line:#1e2740;
  --steel:#6c94c8; --accent:#03d4ff; --zone:rgba(3,212,255,.14); --good:#3ee0a1; --warn:#ffb547; --bad:#ff6b7f;
  --dot:#161f33; --chip:#10141f;
}
:root{--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:40px;--s7:64px;--s8:96px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:17px;line-height:1.5;
  background-image:radial-gradient(var(--dot) 1px, transparent 1.2px);background-size:14px 14px;background-attachment:fixed}
.mono{font-family:'Geist Mono',ui-monospace,Menlo,Consolas,monospace}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 56px}
header.top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.brand{font-weight:700;letter-spacing:.02em;font-stretch:110%}
.brand span{color:var(--accent)}
h1{font-family:'NewBlack',sans-serif;font-weight:800;line-height:.92;font-size:clamp(40px,5.4vw,78px);letter-spacing:-.01em;max-width:15ch}
h2{font-family:'NewBlack',sans-serif;font-weight:800;line-height:1;margin:0 0 10px}
h4.glab{font-family:'NewBlack',sans-serif;font-weight:750;font-size:15px;margin:20px 0 8px;color:var(--muted)}
p{margin:0 0 14px;max-width:64ch}
.lede{font-size:19px;color:var(--muted)}
.muted{color:var(--muted)}
.stepnum{font-size:14px;color:var(--accent);letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--accent);color:#03101c;border:0;border-radius:4px;padding:13px 22px;font-weight:700;font-size:16px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.35;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.missions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.missions{grid-template-columns:1fr}}
.mcard{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px;display:grid;gap:10px;align-content:start;transition:border-color .15s}
.mcard:hover{border-color:var(--accent)}
.mcard .t{font-family:'NewBlack',sans-serif;font-weight:800;font-size:26px;line-height:1.02}
.mcard .ml{color:var(--muted);font-size:15.5px}
.needs{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:'Geist Mono',monospace;font-size:12.5px;background:var(--chip);border-radius:3px;padding:2px 7px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:24px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.side{position:static;max-height:none;overflow:visible}

.missionbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.missionbar .t{font-family:'NewBlack',sans-serif;font-weight:800;font-size:clamp(24px,3.4vw,34px);line-height:1}
.linkbtn{background:none;border:0;color:var(--accent);text-decoration:underline;padding:0;font-size:15px}
.progress{display:flex;gap:4px;margin-bottom:18px}
.progress i{flex:1;height:4px;background:var(--line);border-radius:2px}
.progress i.done{background:var(--accent)}
.what{color:var(--muted);font-size:16px}
.ask{border-left:3px solid var(--accent);padding:6px 12px;margin:0 0 16px;font-size:16px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-bottom:6px}
.opt{text-align:left;background:transparent;border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:grid;gap:7px;align-content:start}
.opt:hover{border-color:var(--steel)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--chip);box-shadow:inset 4px 0 0 var(--accent)}
.opt .name{font-weight:700;font-size:16px;line-height:1.25}
.opt .blurb{color:var(--muted);font-size:14.5px}
.opt .chips{display:flex;flex-wrap:wrap;gap:5px}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px}
svg.sat{width:100%;max-width:320px;height:auto;display:block;margin:0 auto}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:10px auto 1fr;gap:8px;align-items:baseline;font-size:15px;border-bottom:1px dashed var(--line);padding-bottom:8px}
.row .rs{text-align:right;font-family:'Geist Mono',monospace;font-size:13px}
.row .rn{grid-column:2 / -1;color:var(--muted);font-size:13.5px;line-height:1.45}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}
.dot.ready{background:var(--good)} .dot.limited{background:var(--warn)} .dot.problem{background:var(--bad)}
.s-ready{color:var(--good)} .s-limited{color:var(--warn)} .s-problem{color:var(--bad)}
.cleared{font-family:'NewBlack',sans-serif;font-weight:800;font-size:clamp(34px,5.4vw,62px);line-height:1;margin:0 0 12px;max-width:16ch}
.can{margin:0 0 16px;padding-left:20px;color:var(--muted)}
.can li{margin-bottom:6px}
.closer{font-family:'NewBlack',sans-serif;font-weight:800;font-size:clamp(28px,4.4vw,44px);line-height:1;margin:26px 0 12px;max-width:20ch}
.fine{font-size:13px;color:var(--muted);margin-top:22px}

.dot.strong{background:var(--good)} .dot.possible{background:var(--warn)} .dot.challenging{background:#e07b2a} .dot.problem{background:var(--bad)}
.s-strong{color:var(--good)} .s-possible{color:var(--warn)} .s-challenging{color:#e07b2a} .s-problem{color:var(--bad)}
.budget{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:12px 16px;margin-bottom:18px}
.budget.over{border-color:var(--bad)}
.budget.over .big{color:var(--bad)}
.big{font-size:24px;font-weight:500}

const STEPS = [

const satLabel = () => /satellite$/i.test(S.m.name) ? S.m.name : S.m.name + ' satellite';
let S = {screen:'intro', m:null, step:0, picks:{}, open:null};
const app = document.getElementById('app');
const P = k => S.picks[k];
const PARTS = () => ({o:P('orbit')&&ORBITS[P('orbit')], ar:P('array')&&ARRAYS[P('array')], ba:P('batt')&&BATTS[P('batt')],
  pl:P('payload')&&S.m.payloads.find(p=>p.id===P('payload')), po:P('point')&&POINTS[P('point')],
  rd:P('radio')&&RADIOS[P('radio')], bu:P('bus')&&BUSES[P('bus')], pr:P('prop')&&PROPS[P('prop')]});
const spent = () => Object.values(PARTS()).reduce((a,p)=>a+(p?p.cost:0),0);
const left = () => S.m ? S.m.budget - spent() : 0;


const ADVICE = 'A lower-level component can save you credits for something else.';
const tidy = t => { if(!t) return t;
  const parts = t.split(/(?<=[.!?])\s+/).map(x=>x.trim()).filter(Boolean);
  const seen = new Set(); const keep = [];
  parts.forEach(p=>{ const k=p.toLowerCase(); if(!seen.has(k)){ seen.add(k); keep.push(p); } });
  return keep.join(' '); };
const minOption = (src, need) => Object.values(src).find(o => o.lvl >= need) || Object.values(src).slice(-1)[0];
const powerNeed = () => { const {pl,rd} = PARTS(); return Math.max(pl?pl.power:1, rd?rd.lvl-2:1, P('prop')==='elec'?2:1); };
const busNeed = () => { const {pl,ar} = PARTS(); return Math.max(pl?pl.size:1, ar?ar.lvl:1); };
const rowBy = (rows,k) => rows.find(r=>r.key===k);

const STEP_ROWS = {orbit:['orbit'], power:[], payload:['sensing'], point:['point'], radio:['comms'], bus:['bus'], prop:['prop']};
const FOCUS_ROWS = {orbit:['orbit'], power:['power'], payload:['sensing'], point:['point'], radio:['comms'], bus:['bus'], prop:['prop']};

const AFFECTED = {orbit:'orbit', sensing:'payload', point:'pointing system', comms:'communication system',
  power:'power system', bus:'spacecraft', prop:'manoeuvring'};

function stepFeedback(stepKey, rows){
  const {o,ar,ba,pl,po,rd,bu,pr} = PARTS(), out = [];
  const flag = (row, because) => { if(row && row.fit && row.fit!=='strong' && row.note)
    out.push({tone:row.fit, title:`Your ${AFFECTED[row.key] || row.label.toLowerCase()} will be affected`,
      text:(because?because+' ':'')+row.note}); };
  (STEP_ROWS[stepKey]||[]).forEach(k=>{
    const r = rowBy(rows,k);
    let because = null;
    if(k==='comms' && pl) because = `Your ${pl.name.toLowerCase()} decides this.`;
    if(k==='point' && pl) because = `Your ${pl.name.toLowerCase()} decides this.`;
    if(k==='bus' && pl) because = `Your payload and solar array decide this.`;
    if(k==='power' && pl) because = `Your ${pl.name.toLowerCase()} and radio decide this.`;
    flag(r, because);
  });
  if(stepKey==='orbit' && o){
    if(ba) flag(rowBy(rows,'power'), 'Your orbit decides how much battery you need.');
    if(pr) flag(rowBy(rows,'prop'), 'Your orbit decides this.');
    else if(P('orbit')==='leo') out.push({tone:'info', title:'Your propulsion will be affected', text:'Low orbit still has a trace of atmosphere dragging on the spacecraft. When you reach the propulsion step later in this game, you will want real thrusters here, to hold your path and come down safely at the end.'});
    else if(P('orbit')==='meo') out.push({tone:'info', title:'Your propulsion will be affected', text:'Medium orbit is the most forgiving for propulsion. Once the spacecraft is inserted there is almost no drag to fight, so when you reach the propulsion step later in this game you can get away with very little.'});
    else out.push({tone:'info', title:'Your propulsion will be affected', text:'A launch vehicle can place your spacecraft on the right trajectory, but some specialised orbits require onboard propulsion to complete the journey or make course corrections along the way.'});
    if(!ba) out.push({tone:'info', title:'Your battery will be affected', text: o.batt>1 ? 'This orbit passes through Earth\u2019s shadow on every loop, so you will need enough stored energy to keep running.' : 'This orbit spends most of its time in sunlight, so you can get by with less stored energy.'});
  }
  if(stepKey==='payload' && pl){
    const art = w => (/^[aeiou]/.test(w) ? 'an ' : 'a ') + w;
    const bits = [`${art(minOption(RADIOS, pl.data).name.toLowerCase())} or faster`,
      `${minOption(POINTS, pl.point).name.toLowerCase()} or better`,
      `${art(minOption(BUSES, busNeed()).name.toLowerCase())} or bigger`,
      `${art(minOption(ARRAYS, powerNeed()).name.toLowerCase())} or larger`];
    out.push({tone:'info', title:'Your later choices will be affected', text:`To work at full capacity, this payload needs ${bits.join(', ')}. Anything less and it cannot do its job properly.`});
    ['comms','point','bus','power'].forEach(k=>flag(rowBy(rows,k), 'Set by this payload:'));
  }
  if(stepKey==='power'){
    const needArr = powerNeed();
    const draws = [pl && pl.name.toLowerCase(), rd && rd.name.toLowerCase(), P('prop')==='elec' && 'electric propulsion'].filter(Boolean);
    const drawList = draws.length>1 ? draws.slice(0,-1).join(', ') + ' and ' + draws[draws.length-1] : draws[0];
    const arrName = minOption(ARRAYS, needArr).name.toLowerCase();
    const needLine = `Your ${drawList || 'payload'} draw${draws.length===1?'s':''} on this. It needs at least ${/^[aeiou]/.test(arrName)?'an':'a'} ${arrName}.`;
    if(!ar){
      out.push({tone:'info', title:'Your power system will be affected', text:needLine});
    } else if(ar.lvl < needArr-1){
      out.push({tone:'challenging', title:'Your power system will be affected', text:`${needLine} This array can\u2019t generate enough power, so the spacecraft couldn\u2019t run properly.`});
    } else if(ar.lvl === needArr-1){
      out.push({tone:'possible', title:'Your power system will be affected', text:`${needLine} With this array everything runs, but there is no power to spare for spikes or additions.`});
    } else if(ar.lvl >= needArr+2){
      out.push({tone:'possible', title:'Your power system will be affected', text:`More generation than this spacecraft can use. ${ADVICE}`});
    } else {
      out.push({tone:'info', title:'Your power system will be affected', text:needLine});
    }
    if(ba){
      const bneed = Math.max(o?o.batt:1, pl?(pl.power>=4?2:1):1);
      if(ba.lvl < bneed) out.push({tone:'possible', title:'Your battery will be affected', text:'Storage is short for the time this spacecraft spends in Earth\u2019s shadow, so it would lose power before the next sunlit pass.'});
      else if(ba.lvl >= bneed+2) out.push({tone:'possible', title:'Your battery will be affected', text:`More stored energy than this spacecraft will draw on. ${ADVICE}`});
      else out.push({tone:'info', title:'Your battery will be affected', text: (o && o.batt>1)
        ? 'This orbit passes through Earth\u2019s shadow on every loop, and this battery carries the spacecraft through it.'
        : 'This orbit spends most of its time in sunlight, so this battery has an easy job.'});
    }
    if(ar) flag(rowBy(rows,'bus'), 'Bigger arrays need a bigger spacecraft:');
  }
  if(stepKey==='radio' && rd && rd.lvl===5 && po && po.lvl<3){
    out.push({tone:'problem', title:'Your pointing system will be affected', text:'A laser beam is narrow and has to be held exactly on its receiver. Go back and raise your pointing system, or choose a radio instead.'});
  }
  if(stepKey==='prop' && P('prop')==='elec'){
    if(ar) flag(rowBy(rows,'power'), 'Electric propulsion runs on electricity:');
    else out.push({tone:'info', title:'Your power system will be affected', text:'Electric propulsion runs on electricity, so it raises the size of the solar array you will need at the next step.'});
  }
  const seen = new Set();
  return out.filter(x => { x.text = tidy(x.text);
    const k = x.text.toLowerCase(); if(seen.has(k)) return false; seen.add(k); return true; });
}

function tier(have, need, under1, under2, over){
  if(have >= need+2) return ['possible', over];
  if(have >= need) return ['strong', null];
  if(have === need-1) return ['possible', under1];
  return ['challenging', under2];
}

function evaluate(){
  const {o,ar,ba,pl,po,rd,bu,pr} = PARTS(), m = S.m, rows = [];
  rows.push({key:'orbit', label:'Orbit', ...(o?{fit:m.orbitFit[P('orbit')][0], note:m.orbitFit[P('orbit')][1]}:{})});
  rows.push({key:'sensing', label:'Payload', ...(pl?{fit:pl.fit, note:pl.note}:{})});

  if(po && pl){
    const need = Math.max(pl.point, rd && rd.lvl===5 ? 3 : 0);
    const t = tier(po.lvl, need,
      'Close, but not quite steady enough for this instrument. Some of what it captures would be blurred or off target.',
      'Nowhere near steady enough for this instrument. It would rarely be looking at the right thing for long enough.',
      'More pointing accuracy than this mission needs. A lower-level component can save you credits for something else.');
    let fit = worst(t[0], m.pointFit[P('point')]);
    let note = t[1] || (m.pointFit[P('point')]!=='strong' ? 'This level of pointing is not what this mission usually needs.' : null);
    if(rd && rd.lvl===5 && po.lvl<3){ fit='problem'; note='A laser link has to be aimed exactly at a receiver far away. This pointing system cannot hold that aim.'; }
    rows.push({key:'point', label:'Pointing', fit, note});
  } else rows.push({key:'point', label:'Pointing'});

  if(rd && pl){
    const t = tier(rd.lvl, pl.data,
      'Data bottleneck: your payload collects a little more than this radio can comfortably send.',
      'Data bottleneck: your payload collects far more information than this radio can send. Most of it would never reach the ground.',
      'Much more capacity than this payload produces. A lower-level component can save you credits for something else.');
    rows.push({key:'comms', label:'Communication', fit:t[0], note:t[1]});
  } else rows.push({key:'comms', label:'Communication'});

  if(ar && pl){
    const need = Math.max(pl.power, rd?rd.lvl-2:1, P('prop')==='elec'?2:1);
    const t = tier(ar.lvl, need,
      'Your chosen components will run, but there won\u2019t be any power to spare for spikes or additions.',
      'Your payload needs far more power than this array can make. It could not run properly.',
      'More generation than this spacecraft can use. A lower-level component can save you credits for something else.');
    let fit = t[0], note = t[1];
    if(ba){
      const bneed = Math.max(o?o.batt:1, pl.power>=4?2:1);
      if(ba.lvl < bneed){ fit = worst(fit,'possible'); note = (note?note+' ':'') + 'Storage is short for the time this spacecraft spends in Earth\u2019s shadow.'; }
      else if(ba.lvl >= bneed+2){ fit = worst(fit,'possible'); note = (note?note+' ':'') + 'More stored energy than this spacecraft will draw on. ' + ADVICE; }
    }
    rows.push({key:'power', label:'Power', fit, note:tidy(note)});
  } else rows.push({key:'power', label:'Power'});

  if(bu && pl && ar){
    const need = Math.max(pl.size, ar.lvl);
    const t = tier(bu.lvl, need,
      'Your chosen components will fit, but there won\u2019t be any space for spares or additions.',
      'Space constraint: your payload and power system need more room and supporting hardware than this spacecraft can provide.',
      'Much more spacecraft than this payload needs. A lower-level component can save you credits for something else.');
    rows.push({key:'bus', label:'Spacecraft', fit:t[0], note:t[1]});
  } else rows.push({key:'bus', label:'Spacecraft'});

  if(pr){
    let fit = m.propFit[P('prop')], note = null;
    const ob = P('orbit'), pk = P('prop');
    if(fit==='possible') note = 'It will work, but it limits how much this spacecraft can change or correct its path later.';
    if(fit==='challenging') note = 'Not enough push for the manoeuvring this mission tends to need.';
    if(ob==='leo'){
      if(pk==='none'){ fit = worst(fit,'challenging'); note = 'Low orbit still has a thin trace of atmosphere, which drags on the spacecraft. Without thrusters it loses height, drifts off its path, and cannot bring itself down safely at the end of its life.'; }
      else if(pk==='cold'){ fit = worst(fit,'possible'); note = 'Enough for small corrections, but light on push for fighting drag over a long mission in low orbit.'; }
    } else if(ob==='meo'){
      if(pk==='none') note = 'Medium orbit is the most forgiving choice here. Once the spacecraft is inserted there is almost no drag to fight, so it can hold its path with little or no thrust.';
      else if(fit==='possible') note = 'Medium orbit asks little of propulsion once the spacecraft is inserted, so this is more than enough.';
    } else if(pk==='none'){
      fit = worst(fit,'challenging'); note = 'Launch vehicles usually release spacecraft onto a transfer path towards this orbit rather than into it. Without propulsion, the spacecraft cannot finish the climb, correct its course, or hold its slot once it arrives.';
    }
    rows.push({key:'prop', label:'Manoeuvring', fit, note});
  } else rows.push({key:'prop', label:'Manoeuvring'});

  const over = spent() > m.budget;
  rows.push({key:'budget', label:'Budget', fit: over?'problem':'strong',
    note: over ? `Your design costs ${spent()} PC, which is ${spent()-m.budget} PC over the mission budget. Some specifications need to change.` : null});
  return rows;
}


function payloadArt(kind, cx, cy, u){
  const A='var(--accent)', P='var(--panel)', k=u/14;  // u scales with payload size
  const g=(x)=>x.join('');
  switch(kind){
    case 'lens': return g([`<circle cx="${cx}" cy="${cy}" r="${u}" fill="${P}" stroke="${A}" stroke-width="2"/>`,
      `<circle cx="${cx}" cy="${cy}" r="${u*0.62}" fill="none" stroke="${A}" stroke-width="1.2"/>`,
      `<circle cx="${cx}" cy="${cy}" r="${u*0.26}" fill="${A}"/>`]);
    case 'bands': return g([`<circle cx="${cx}" cy="${cy}" r="${u}" fill="${P}" stroke="${A}" stroke-width="2"/>`,
      [-0.5,0,0.5].map(o=>`<line x1="${cx+o*u}" y1="${cy-u*0.7}" x2="${cx+o*u}" y2="${cy+u*0.7}" stroke="${A}" stroke-width="1.6"/>`).join('')]);
    case 'spectral': case 'spectral2': return g([`<circle cx="${cx}" cy="${cy}" r="${u}" fill="${P}" stroke="${A}" stroke-width="2"/>`,
      [-0.72,-0.48,-0.24,0,0.24,0.48,0.72].map(o=>`<line x1="${cx+o*u}" y1="${cy-u*0.72}" x2="${cx+o*u}" y2="${cy+u*0.72}" stroke="${A}" stroke-width="1"/>`).join(''),
      kind==='spectral2'?`<circle cx="${cx}" cy="${cy}" r="${u*1.3}" fill="none" stroke="${A}" stroke-width="1" stroke-dasharray="3 3"/>`:'']);
    case 'thermal': return g([`<circle cx="${cx}" cy="${cy}" r="${u*0.8}" fill="${P}" stroke="var(--warn)" stroke-width="2"/>`,
      [0,45,90,135].map(a=>{const r1=u*0.95,r2=u*1.25,rad=a*Math.PI/180;
        return `<line x1="${cx+Math.cos(rad)*r1}" y1="${cy+Math.sin(rad)*r1}" x2="${cx+Math.cos(rad)*r2}" y2="${cy+Math.sin(rad)*r2}" stroke="var(--warn)" stroke-width="1.4"/>
                <line x1="${cx-Math.cos(rad)*r1}" y1="${cy-Math.sin(rad)*r1}" x2="${cx-Math.cos(rad)*r2}" y2="${cy-Math.sin(rad)*r2}" stroke="var(--warn)" stroke-width="1.4"/>`}).join('')]);
    case 'radar': return g([`<rect x="${cx-u*1.5}" y="${cy-u*0.62}" width="${u*3}" height="${u*1.24}" fill="${P}" stroke="${A}" stroke-width="2"/>`,
      [0.25,0.5,0.75].map(o=>`<line x1="${cx-u*1.5+u*3*o}" y1="${cy-u*0.62}" x2="${cx-u*1.5+u*3*o}" y2="${cy+u*0.62}" stroke="${A}" stroke-width="1"/>`).join('')]);
    case 'horn': return `<path d="M${cx-u*0.5} ${cy+u} L${cx-u} ${cy-u} L${cx+u} ${cy-u} L${cx+u*0.5} ${cy+u} Z" fill="${P}" stroke="${A}" stroke-width="2"/>`;
    case 'dish': case 'dish2': return g([`<path d="M${cx-u*1.2} ${cy+u*0.5} A ${u*1.2} ${u*1.2} 0 0 1 ${cx+u*1.2} ${cy+u*0.5} Z" fill="${P}" stroke="${A}" stroke-width="2"/>`,
      `<line x1="${cx}" y1="${cy+u*0.5}" x2="${cx}" y2="${cy-u*0.5}" stroke="${A}" stroke-width="1.6"/><circle cx="${cx}" cy="${cy-u*0.6}" r="${u*0.18}" fill="${A}"/>`,
      kind==='dish2'?`<path d="M${cx-u*0.7} ${cy+u*0.5} A ${u*0.7} ${u*0.7} 0 0 1 ${cx+u*0.7} ${cy+u*0.5}" fill="none" stroke="${A}" stroke-width="1"/>`:'']);
    case 'crosslink': return g([`<path d="M${cx-u*1.4} ${cy} A ${u*0.7} ${u*0.7} 0 0 1 ${cx-u*0.1} ${cy} Z" fill="${P}" stroke="${A}" stroke-width="1.8"/>`,
      `<path d="M${cx+u*0.1} ${cy} A ${u*0.7} ${u*0.7} 0 0 0 ${cx+u*1.4} ${cy} Z" fill="${P}" stroke="${A}" stroke-width="1.8"/>`,
      `<line x1="${cx-u*0.75}" y1="${cy}" x2="${cx-u*0.75}" y2="${cy-u*0.7}" stroke="${A}" stroke-width="1.2"/>`,
      `<line x1="${cx+u*0.75}" y1="${cy}" x2="${cx+u*0.75}" y2="${cy+u*0.7}" stroke="${A}" stroke-width="1.2"/>`]);
    case 'chip': case 'chipcore': case 'chipgrid': {
      const n = kind==='chip'?1:(kind==='chipcore'?2:3), w=u*1.5;
      let inner='';
      for(let a=0;a<n;a++) for(let bI=0;bI<n;bI++)
        inner += `<rect x="${cx-w*0.62+a*(w*1.24/n)+2}" y="${cy-w*0.62+bI*(w*1.24/n)+2}" width="${w*1.24/n-4}" height="${w*1.24/n-4}" fill="none" stroke="${A}" stroke-width="1"/>`;
      const pins = [-0.4,0,0.4].map(o=>`<line x1="${cx-w*0.62}" y1="${cy+o*w}" x2="${cx-w*0.85}" y2="${cy+o*w}" stroke="${A}" stroke-width="1.2"/>
        <line x1="${cx+w*0.62}" y1="${cy+o*w}" x2="${cx+w*0.85}" y2="${cy+o*w}" stroke="${A}" stroke-width="1.2"/>`).join('');
      return `<rect x="${cx-w*0.62}" y="${cy-w*0.62}" width="${w*1.24}" height="${w*1.24}" fill="${P}" stroke="${A}" stroke-width="2"/>${inner}${pins}`;
    }
    case 'stack': case 'chipstack': return g([[-0.7,-0.23,0.24].map(o=>`<rect x="${cx-u}" y="${cy+o*u*1.3}" width="${u*2}" height="${u*0.62}" fill="${P}" stroke="${A}" stroke-width="1.6"/>`).join(''),
      kind==='chipstack'?`<rect x="${cx-u*0.5}" y="${cy-u*1.5}" width="${u}" height="${u*0.6}" fill="none" stroke="${A}" stroke-width="1.4"/>`:'']);
    case 'laser': return g([`<circle cx="${cx}" cy="${cy}" r="${u*0.6}" fill="${P}" stroke="${A}" stroke-width="2"/>`,
      `<line x1="${cx+u*0.6}" y1="${cy}" x2="${cx+u*1.8}" y2="${cy}" stroke="${A}" stroke-width="1.4" stroke-dasharray="3 3"/>`,
      `<line x1="${cx-u*0.6}" y1="${cy}" x2="${cx-u*1.8}" y2="${cy}" stroke="${A}" stroke-width="1.4" stroke-dasharray="3 3"/>`]);
    case 'tube': case 'tubebig': case 'tubethin': case 'tubecold': {
      const w = kind==='tubethin'? u*0.8 : (kind==='tubebig'? u*1.5 : u*1.15);
      return g([`<rect x="${cx-w/2}" y="${cy-u*1.2}" width="${w}" height="${u*2.4}" rx="${w*0.2}" fill="${P}" stroke="${A}" stroke-width="2"/>`,
        `<ellipse cx="${cx}" cy="${cy-u*1.2}" rx="${w/2}" ry="${w*0.22}" fill="none" stroke="${A}" stroke-width="1.4"/>`,
        kind==='tubecold'?[-0.4,0,0.4].map(o=>`<line x1="${cx-w/2-u*0.4}" y1="${cy+o*u}" x2="${cx+w/2+u*0.4}" y2="${cy+o*u}" stroke="var(--warn)" stroke-width="1.2"/>`).join(''):'']);
    }
    case 'prism': case 'suite': return g([`<path d="M${cx} ${cy-u} L${cx+u} ${cy+u*0.8} L${cx-u} ${cy+u*0.8} Z" fill="${P}" stroke="${A}" stroke-width="2"/>`,
      [-0.25,0,0.25].map(o=>`<line x1="${cx+u}" y1="${cy+u*0.2}" x2="${cx+u*1.9}" y2="${cy+u*0.2+o*u}" stroke="${A}" stroke-width="1.1"/>`).join(''),
      kind==='suite'?`<rect x="${cx-u*1.9}" y="${cy-u*0.6}" width="${u*0.7}" height="${u*1.5}" rx="3" fill="none" stroke="${A}" stroke-width="1.4"/>`:'']);
    case 'dipoles': case 'multiant': {
      const n = kind==='dipoles'?3:5, sp = u*2.2/(n-1);
      let o='';
      for(let a=0;a<n;a++){ const x = cx-u*1.1+a*sp;
        o += `<line x1="${x}" y1="${cy+u*0.8}" x2="${x}" y2="${cy-u*0.9}" stroke="${A}" stroke-width="1.6"/><circle cx="${x}" cy="${cy-u}" r="${u*0.14}" fill="${A}"/>`; }
      return o + `<line x1="${cx-u*1.2}" y1="${cy+u*0.8}" x2="${cx+u*1.2}" y2="${cy+u*0.8}" stroke="${A}" stroke-width="2"/>`;
    }
    case 'waves': return g([`<rect x="${cx-u*1.4}" y="${cy-u*0.9}" width="${u*2.8}" height="${u*1.8}" fill="${P}" stroke="${A}" stroke-width="2"/>`,
      `<path d="M${cx-u*1.1} ${cy} q ${u*0.28} ${-u*0.7} ${u*0.55} 0 q ${u*0.28} ${u*0.7} ${u*0.55} 0 q ${u*0.28} ${-u*0.7} ${u*0.55} 0 q ${u*0.28} ${u*0.7} ${u*0.55} 0" fill="none" stroke="${A}" stroke-width="1.4"/>`]);
    default: return `<circle cx="${cx}" cy="${cy}" r="${u}" fill="${P}" stroke="${A}" stroke-width="2"/>`;
  }
}

function satSVG(){
  const {o,ar,ba,pl,po,rd,bu,pr} = PARTS();
  const dims = {1:[78,96],2:[112,124],3:[152,150],4:[182,172]};
  const [bw,bh] = bu ? dims[bu.lvl] : [110,110];
  const cx=200, cy=152, x=cx-bw/2, y=cy-bh/2;
  let s = `<svg class="sat" viewBox="0 0 400 290" role="img" aria-label="Sketch of your spacecraft so far">
  <defs><pattern id="dm" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="var(--steel)"/></pattern>
  <pattern id="dm2" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1.2" fill="var(--accent)"/></pattern></defs>`;

  /* orbit: Earth and the path the spacecraft flies, top-left inset */
  if(o){
    const ex=54, ey=58, er=16, ring={leo:25, meo:34, geo:44, spec:44}[P('orbit')];
    s += `<circle cx="${ex}" cy="${ey}" r="${er}" fill="url(#dm)" stroke="var(--steel)" stroke-width="1.4"/>`;
    s += P('orbit')==='spec'
      ? `<ellipse cx="${ex+16}" cy="${ey}" rx="${ring+16}" ry="${ring-8}" fill="none" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="4 4" transform="rotate(-18 ${ex} ${ey})"/>
         <circle cx="${ex+ring+28}" cy="${ey-12}" r="3.4" fill="var(--accent)"/>`
      : `<circle cx="${ex}" cy="${ey}" r="${ring}" fill="none" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="4 4"/>
         <circle cx="${ex+ring}" cy="${ey}" r="3.4" fill="var(--accent)"/>`;
  }

  /* solar arrays */
  if(ar){
    const pwid = ar.lvl===1 ? 0 : Math.min({2:62,3:94,4:120}[ar.lvl], x-10), ph = bh*0.78;
    if(pwid>0) s += `<rect x="${x-pwid-6}" y="${cy-ph/2}" width="${pwid}" height="${ph}" fill="url(#dm2)" stroke="var(--accent)"/>
      <rect x="${x+bw+6}" y="${cy-ph/2}" width="${pwid}" height="${ph}" fill="url(#dm2)" stroke="var(--accent)"/>
      <line x1="${x-6}" y1="${cy}" x2="${x}" y2="${cy}" stroke="var(--steel)" stroke-width="2"/>
      <line x1="${x+bw}" y1="${cy}" x2="${x+bw+6}" y2="${cy}" stroke="var(--steel)" stroke-width="2"/>`;
  }

  /* the body */
  s += `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" fill="url(#dm)" stroke="var(--ink)" stroke-width="${bu?2:1.2}" ${bu?'':'stroke-dasharray="4 4"'} rx="2"/>`;
  if(ar && ar.lvl===1) s += `<rect x="${x+6}" y="${y+6}" width="${bw-12}" height="12" fill="url(#dm2)"/>`;

  /* payload aperture */
  if(pl){
    s += payloadArt(pl.art || 'lens', cx, cy-2, 9 + pl.size*6);
  }

  /* batteries: cells stacked inside the body */
  if(ba){
    const cw = 11, ch = 7, gap = 3, n = ba.lvl, bx = x + 8, by = y + bh - 12 - ch;
    for(let i=0;i<n;i++) s += `<rect x="${bx + i*(cw+gap)}" y="${by}" width="${cw}" height="${ch}" fill="none" stroke="var(--good)" stroke-width="1.4" rx="1"/>`;
    s += `<line x1="${bx}" y1="${by+ch+4}" x2="${bx + n*(cw+gap) - gap}" y2="${by+ch+4}" stroke="var(--good)" stroke-width="1"/>`;
  }

  /* pointing: sun sensor, star trackers, fine guidance */
  if(po){
    const sx = x + bw - 10, sy = y + 10;
    s += `<rect x="${sx-12}" y="${sy}" width="12" height="9" fill="none" stroke="var(--warn)" stroke-width="1.4"/>`;
    if(po.lvl>=2) s += `<rect x="${sx-30}" y="${sy-9}" width="9" height="18" fill="none" stroke="var(--warn)" stroke-width="1.4"/>
                        <line x1="${sx-25.5}" y1="${sy-9}" x2="${sx-25.5}" y2="${sy-17}" stroke="var(--warn)" stroke-width="1.4"/>`;
    if(po.lvl>=3) s += `<rect x="${sx-46}" y="${sy-9}" width="9" height="18" fill="none" stroke="var(--warn)" stroke-width="1.4"/>
                        <line x1="${sx-41.5}" y1="${sy-9}" x2="${sx-41.5}" y2="${sy-17}" stroke="var(--warn)" stroke-width="1.4"/>`;
    if(po.lvl>=4) s += `<circle cx="${x+12}" cy="${y+bh-14}" r="5" fill="none" stroke="var(--warn)" stroke-width="1.4"/>
                        <circle cx="${x+26}" cy="${y+bh-14}" r="5" fill="none" stroke="var(--warn)" stroke-width="1.4"/>`;
  }

  /* propulsion */
  if(pr){
    const ny=y+bh;
    if(pr.mass>0){
      const nw=9+pr.mass*6;
      s += `<path d="M${cx-nw/2} ${ny} L${cx+nw/2} ${ny} L${cx+nw} ${ny+22} L${cx-nw} ${ny+22} Z" fill="none" stroke="var(--steel)" stroke-width="2"/>`;
      if(P('prop')==='elec') s += `<path d="M${cx-8} ${ny+30} Q${cx} ${ny+46} ${cx+8} ${ny+30}" fill="none" stroke="var(--accent)" stroke-width="1.6"/>`;
      if(P('prop')==='hybrid') s += `<circle cx="${x+bw-16}" cy="${y+bh-16}" r="7" fill="none" stroke="var(--steel)" stroke-width="1.6"/>`;
    } else {
      s += `<rect x="${cx-16}" y="${ny}" width="32" height="9" fill="none" stroke="var(--steel)" stroke-width="1.6" stroke-dasharray="3 3"/>`;
    }
  }

  /* radio */
  if(rd){
    if(rd.lvl<=2) s += `<line x1="${x+14}" y1="${y}" x2="${x-14}" y2="${y-34}" stroke="var(--ink)" stroke-width="1.8"/>
                        ${rd.lvl===2?`<line x1="${x-14}" y1="${y-34}" x2="${x-2}" y2="${y-40}" stroke="var(--ink)" stroke-width="1.6"/>`:''}`;
    else if(rd.lvl<=4) s += `<path d="M${x+4} ${y-6} Q${x+26} ${y-40} ${x+50} ${y-6}" fill="none" stroke="var(--ink)" stroke-width="2"/>
                        <line x1="${x+27}" y1="${y-6}" x2="${x+27}" y2="${y-24}" stroke="var(--ink)" stroke-width="1.6"/>
                        ${rd.lvl===4?`<path d="M${x+bw-50} ${y-6} Q${x+bw-26} ${y-36} ${x+bw-4} ${y-6}" fill="none" stroke="var(--ink)" stroke-width="2"/>`:''}`;
    else s += `<circle cx="${x+26}" cy="${y-26}" r="9" fill="none" stroke="var(--accent)" stroke-width="2"/>
               <line x1="${x+26}" y1="${y-35}" x2="${x+26}" y2="${y-52}" stroke="var(--accent)" stroke-width="1.6"/>
               <line x1="${x+26}" y1="${y-17}" x2="${x+26}" y2="${y}" stroke="var(--accent)" stroke-width="1.6"/>`;
  }
  return s + `</svg>`;
}

function dashboard(rows, showAll, focusKeys, editable){
  const issues = rows.filter(r=>r.fit && r.fit!=='strong');
  const head = `<div class="dashhead ${issues.length?'has':'clear'}">
      <span class="dh-t">Mission readiness</span>
      <span class="dh-s">${issues.length ? issues.length + (issues.length===1?' system needs attention':' systems need attention') : 'Every system suits the mission'}</span>
      ${editable?`<span class="dh-h">Click any system to change it</span>`:''}
    </div>`;
  return head + `<div class="rows">${rows.map(r=>{
    const foc = focusKeys && focusKeys.includes(r.key) ? ' focus' : '';
    const body = r.fit
      ? `<span class="rl">${r.label}</span><span class="rs s-${r.fit}">${FIT[r.fit]}</span>
         ${r.note && (showAll || r.fit!=='strong')?`<span class="rn">${r.note}</span>`:''}`
      : `<span class="rl">${r.label}</span><span class="rs muted">Not chosen</span>`;
    if(editable && ROW_EDIT[r.key]){
      const open = S.open===r.key;
      return `<div class="rowwrap ${open?'open':''}"><button class="row rowbtn ${r.fit||'none'}${foc}" data-row="${r.key}" aria-expanded="${open}">${body}<span class="caret" aria-hidden="true">${open?'\u2212':'+'}</span></button>${open?rowOptions(r.key):''}</div>`;
    }
    if(!r.fit) return `<div class="row none${foc}">${body}</div>`;
    return `<div class="row ${r.fit}${foc}">${body}</div>`;
  }).join('')}</div>`;
}

function budgetBar(){
  const l = left(), used = spent(), pct = Math.min(100, Math.round(used/S.m.budget*100));
  return `<div class="budget ${l<0?'over':''}">
    <div class="bline mono">
      <span class="btag">Pixxel Credits</span> <b>${l} PC</b>
      <span>left to spend of ${S.m.budget} PC</span>
    </div>
    <div class="bmeter"><span style="width:${pct}%"></span></div>
  </div>`;
}

/* ---------- between-step loader ---------- */
const L_ORBIT = {leo:'Low Earth Orbit', meo:'Medium Earth Orbit', geo:'Geostationary Orbit', spec:'Specialised Orbit'};
const L_RADIO = {basic:'Basic Radio', med:'Medium-speed Radio', high:'High-speed Radio', vhigh:'Very High-speed Radio', laser:'Laser Communication'};
const L_PROP = {cold:'Cold-Gas', chem:'Chemical', elec:'Electric', hybrid:'Hybrid'};
const L_ARRAY = {m:'Medium Solar Array', l:'Large Solar Array', xl:'Extra-large Solar Array'};
const L_BUS = {s:'Small Spacecraft', m:'Medium Spacecraft', l:'Large Spacecraft', xl:'Extra-large Spacecraft'};

function loaderText(stepKey){
  const {ar,pl,po,bu} = PARTS();
  switch(stepKey){
    case 'orbit': return ['Preparing for ' + L_ORBIT[P('orbit')]];
    case 'payload': return ['Setting up the ' + (pl.job || pl.name.toLowerCase())];
    case 'point': return [po.lvl>=3 ? 'Teaching it to hold perfectly still' : 'Teaching it which way is up'];
    case 'radio': return ['Setting up ' + L_RADIO[P('radio')]];
    case 'prop': return [P('prop')==='none' ? 'Leaving the thrusters at home' : 'Fitting ' + L_PROP[P('prop')] + ' Propulsion'];
    case 'power': return [ar.lvl===1 ? 'Fitting Body-mounted Solar Cells' : 'Unfolding the ' + L_ARRAY[P('array')], 'Charging the Batteries'];
    case 'bus': return ['Assembling the ' + L_BUS[P('bus')]];
    default: return ['Running the final checks'];
  }
}

function runLoader(lines, done){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ done(); return; }
  const el = document.createElement('div');
  el.className = 'loader';
  el.innerHTML = `<div><p class="ldtxt">${lines[0]}</p>${lines[1]?`<p class="ldsub mono">${lines[1]}</p>`:''}<div class="ldbar"><span></span></div></div>`;
  document.body.appendChild(el);
  requestAnimationFrame(()=>{ el.querySelector('.ldbar span').style.width = '100%'; });
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>{ el.remove(); done(); }, 180); }, 880);
}

function wireReadiness(){
  app.querySelectorAll('.rowbtn').forEach(b=>b.onclick=()=>{
    const y=window.scrollY; S.open = S.open===b.dataset.row ? null : b.dataset.row; render(); window.scrollTo({top:y});
    const again=app.querySelector(`.rowbtn[data-row="${b.dataset.row}"]`); again&&again.focus({preventScroll:true});
  });
  app.querySelectorAll('.rowedit .opt').forEach(b=>b.onclick=()=>{
    const y=window.scrollY, k=b.dataset.k, id=b.dataset.id;
    S.picks[k]=id;
    render(); window.scrollTo({top:y});
    const again=app.querySelector(`.rowedit .opt[data-k="${k}"][data-id="${id}"]`); again&&again.focus({preventScroll:true});
  });
}

function groupFeedback(st, key, fb){
  if(st.groups.length<2) return '';
  const want = key==='array'
    ? f => /power system|spacecraft will be affected/i.test(f.title)
    : f => /battery will be affected/i.test(f.title);
  const mine = fb.filter(want);
  return mine.length ? `<div class="fbs">${mine.map(f=>`<div class="fb ${f.tone}"><b>${f.title}</b>${f.text}</div>`).join('')}</div>` : '';
}

function renderBuild(){
  const st = STEPS[S.step], m = S.m, rows = evaluate();
  const done = st.groups.every(g=>S.picks[g.key]);
  const last = S.step===STEPS.length-1;
  const fb = stepFeedback(st.key, rows);
  app.innerHTML = `
  <h2 class="missionhead">${satLabel()}</h2>
  ${budgetBar()}
  <div class="grid">
    <section class="panel">
      <div class="progress" aria-hidden="true">${STEPS.map((_,k)=>`<i class="${k<S.step||(k===S.step&&done)?'done':''}"></i>`).join('')}</div>
      <h2 class="q">${st.q}</h2>
      ${st.groups.map(g=>{
        const src = g.src(m);
        return `${g.label?`<h4 class="glab">${g.label}</h4>`:''}
        <div class="opts" role="group" aria-label="${g.label||st.title}">
          ${Object.entries(src).map(([id,o])=>`<button class="opt" data-k="${g.key}" data-id="${id}" aria-pressed="${S.picks[g.key]===id}">
            <span class="otop"><span class="name">${o.name}</span><span class="pc mono">${o.cost} PC</span></span>
            <span class="blurb">${o.note}</span>
          </button>`).join('')}
        </div>
        ${groupFeedback(st, g.key, fb)}`;
      }).join('')}
      ${st.groups.length>1 ? '' : (fb.length?`<div class="fbs">${fb.map(f=>`<div class="fb ${f.tone}"><b>${f.title}</b>${f.text}</div>`).join('')}</div>`:'')}
      <details class="info"><summary>${st.info[0]}</summary><p>${st.info[1]}</p></details>
      <div class="nav">
${S.step===0?'<span></span>':'<button class="btn ghost" id="back">Back</button>'}
        <button class="btn" id="next" ${done?'':'disabled'}>${last?'Build your spacecraft':'Next'}</button>
      </div>
    </section>
    <aside class="side panel" aria-label="Mission readiness">
      <div class="satwrap">${satSVG()}</div>
      <h4 class="glab">This mission needs:</h4>
      <div class="needs">${m.needs.map(n=>`<span class="chip">${n}</span>`).join('')}</div>
      ${dashboard(rows,false,FOCUS_ROWS[st.key],true)}
    </aside>
  </div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    S.picks[b.dataset.k]=b.dataset.id;
    render();
    const a=app.querySelector(`.opt[data-k="${b.dataset.k}"][data-id="${b.dataset.id}"]`); a&&a.focus({preventScroll:true});
  });
  wireReadiness();
  const backBtn = document.getElementById('back');
  if(backBtn) backBtn.onclick=()=>{ S.step--; render(); window.scrollTo({top:0}); };
  document.getElementById('next').onclick=()=>{
    const msg = last ? ['Running the final checks'] : loaderText(st.key);
    runLoader(msg, ()=>{ if(last){S.screen='launch';} else S.step++; render(); window.scrollTo({top:0}); });
  };
}

/* ---------- share card ---------- */
const LOGO_IMG = new Image(); LOGO_IMG.src = LOGO;
const SHARE_COL = {bg:'#000000', panel:'#0b1226', ink:'#e6edf7', muted:'#8fa0bd', line:'#1f2c4a',
  steel:'#6c94c8', accent:'#03d4ff', good:'#3ee0a1', warn:'#ffb547', chal:'#ff9a3c', bad:'#ff6b7f'};
const FITCOL = {strong:SHARE_COL.good, possible:SHARE_COL.warn, challenging:SHARE_COL.chal, problem:SHARE_COL.bad};

function artOnCanvas(c, kind, cx, cy, u){
  const A = SHARE_COL.accent, P = SHARE_COL.bg, W = SHARE_COL.warn;
  c.lineWidth = 3; c.strokeStyle = A; c.fillStyle = P;
  const circle = (r, fill) => { c.beginPath(); c.arc(cx, cy, r, 0, 7); if(fill){c.fillStyle=P;c.fill();} c.stroke(); };
  switch(kind){
    case 'lens': circle(u, true); c.lineWidth=2; circle(u*0.62); c.fillStyle=A;
      c.beginPath(); c.arc(cx,cy,u*0.26,0,7); c.fill(); break;
    case 'bands': circle(u, true); c.lineWidth=2;
      [-0.5,0,0.5].forEach(o=>{ c.beginPath(); c.moveTo(cx+o*u, cy-u*0.7); c.lineTo(cx+o*u, cy+u*0.7); c.stroke(); }); break;
    case 'spectral': case 'spectral2': circle(u, true); c.lineWidth=1.6;
      [-0.72,-0.48,-0.24,0,0.24,0.48,0.72].forEach(o=>{ c.beginPath(); c.moveTo(cx+o*u, cy-u*0.72); c.lineTo(cx+o*u, cy+u*0.72); c.stroke(); });
      if(kind==='spectral2'){ c.setLineDash([5,5]); circle(u*1.3); c.setLineDash([]); } break;
    case 'thermal': c.strokeStyle=W; circle(u*0.8, true);
      [0,45,90,135].forEach(a=>{ const r=a*Math.PI/180;
        c.beginPath(); c.moveTo(cx+Math.cos(r)*u*0.95, cy+Math.sin(r)*u*0.95); c.lineTo(cx+Math.cos(r)*u*1.3, cy+Math.sin(r)*u*1.3);
        c.moveTo(cx-Math.cos(r)*u*0.95, cy-Math.sin(r)*u*0.95); c.lineTo(cx-Math.cos(r)*u*1.3, cy-Math.sin(r)*u*1.3); c.stroke(); }); break;
    case 'radar': c.fillStyle=P; c.fillRect(cx-u*1.5, cy-u*0.62, u*3, u*1.24); c.strokeRect(cx-u*1.5, cy-u*0.62, u*3, u*1.24);
      c.lineWidth=1.6; [0.25,0.5,0.75].forEach(o=>{ c.beginPath(); c.moveTo(cx-u*1.5+u*3*o, cy-u*0.62); c.lineTo(cx-u*1.5+u*3*o, cy+u*0.62); c.stroke(); }); break;
    case 'horn': c.beginPath(); c.moveTo(cx-u*0.5, cy+u); c.lineTo(cx-u, cy-u); c.lineTo(cx+u, cy-u); c.lineTo(cx+u*0.5, cy+u); c.closePath(); c.fill(); c.stroke(); break;
    case 'dish': case 'dish2': c.beginPath(); c.arc(cx, cy+u*0.5, u*1.2, Math.PI, 0); c.closePath(); c.fill(); c.stroke();
      c.beginPath(); c.moveTo(cx, cy+u*0.5); c.lineTo(cx, cy-u*0.5); c.stroke();
      c.fillStyle=A; c.beginPath(); c.arc(cx, cy-u*0.6, u*0.18, 0, 7); c.fill(); break;
    case 'crosslink': c.beginPath(); c.arc(cx-u*0.75, cy, u*0.65, Math.PI, 0); c.closePath(); c.fill(); c.stroke();
      c.beginPath(); c.arc(cx+u*0.75, cy, u*0.65, 0, Math.PI); c.closePath(); c.fill(); c.stroke(); break;
    case 'chip': case 'chipcore': case 'chipgrid': {
      const n = kind==='chip'?1:(kind==='chipcore'?2:3), w=u*1.5;
      c.fillStyle=P; c.fillRect(cx-w*0.62, cy-w*0.62, w*1.24, w*1.24); c.strokeRect(cx-w*0.62, cy-w*0.62, w*1.24, w*1.24);
      c.lineWidth=1.6;
      for(let a=0;a<n;a++) for(let b=0;b<n;b++)
        c.strokeRect(cx-w*0.62+a*(w*1.24/n)+4, cy-w*0.62+b*(w*1.24/n)+4, w*1.24/n-8, w*1.24/n-8);
      [-0.4,0,0.4].forEach(o=>{ c.beginPath(); c.moveTo(cx-w*0.62, cy+o*w); c.lineTo(cx-w*0.85, cy+o*w);
        c.moveTo(cx+w*0.62, cy+o*w); c.lineTo(cx+w*0.85, cy+o*w); c.stroke(); }); break;
    }
    case 'stack': case 'chipstack': [-0.7,-0.23,0.24].forEach(o=>{
        c.fillStyle=P; c.fillRect(cx-u, cy+o*u*1.3, u*2, u*0.62); c.strokeRect(cx-u, cy+o*u*1.3, u*2, u*0.62); });
      if(kind==='chipstack') c.strokeRect(cx-u*0.5, cy-u*1.5, u, u*0.6); break;
    case 'laser': circle(u*0.6, true); c.setLineDash([5,5]);
      c.beginPath(); c.moveTo(cx+u*0.6, cy); c.lineTo(cx+u*1.9, cy); c.moveTo(cx-u*0.6, cy); c.lineTo(cx-u*1.9, cy); c.stroke(); c.setLineDash([]); break;
    case 'tube': case 'tubebig': case 'tubethin': case 'tubecold': {
      const w = kind==='tubethin'? u*0.8 : (kind==='tubebig'? u*1.5 : u*1.15);
      c.fillStyle=P; c.fillRect(cx-w/2, cy-u*1.2, w, u*2.4); c.strokeRect(cx-w/2, cy-u*1.2, w, u*2.4);
      c.beginPath(); c.ellipse(cx, cy-u*1.2, w/2, w*0.22, 0, 0, 7); c.stroke();
      if(kind==='tubecold'){ c.strokeStyle=W; c.lineWidth=2;
        [-0.4,0,0.4].forEach(o=>{ c.beginPath(); c.moveTo(cx-w/2-u*0.4, cy+o*u); c.lineTo(cx+w/2+u*0.4, cy+o*u); c.stroke(); }); }
      break;
    }
    case 'prism': case 'suite': c.beginPath(); c.moveTo(cx, cy-u); c.lineTo(cx+u, cy+u*0.8); c.lineTo(cx-u, cy+u*0.8); c.closePath(); c.fill(); c.stroke();
      c.lineWidth=1.6; [-0.25,0,0.25].forEach(o=>{ c.beginPath(); c.moveTo(cx+u, cy+u*0.2); c.lineTo(cx+u*1.9, cy+u*0.2+o*u); c.stroke(); });
      if(kind==='suite') c.strokeRect(cx-u*1.9, cy-u*0.6, u*0.7, u*1.5); break;
    case 'dipoles': case 'multiant': {
      const n = kind==='dipoles'?3:5, sp = u*2.2/(n-1);
      for(let a=0;a<n;a++){ const x = cx-u*1.1+a*sp;
        c.beginPath(); c.moveTo(x, cy+u*0.8); c.lineTo(x, cy-u*0.9); c.stroke();
        c.fillStyle=A; c.beginPath(); c.arc(x, cy-u, u*0.16, 0, 7); c.fill(); }
      c.beginPath(); c.moveTo(cx-u*1.2, cy+u*0.8); c.lineTo(cx+u*1.2, cy+u*0.8); c.stroke(); break;
    }
    case 'waves': c.fillStyle=P; c.fillRect(cx-u*1.4, cy-u*0.9, u*2.8, u*1.8); c.strokeRect(cx-u*1.4, cy-u*0.9, u*2.8, u*1.8);
      c.lineWidth=2.4; c.beginPath(); c.moveTo(cx-u*1.1, cy);
      for(let k=0;k<4;k++){ const x0=cx-u*1.1+k*u*0.55; c.quadraticCurveTo(x0+u*0.14, cy+(k%2?u*0.7:-u*0.7), x0+u*0.55, cy); }
      c.stroke(); break;
    default: circle(u, true);
  }
}

function drawCraft(c, cx, cy, parts){
  const {ar,ba,pl,po,rd,bu,pr} = parts;
  const dims = {1:[120,150],2:[172,190],3:[232,226],4:[280,256]};
  const [bw,bh] = bu ? dims[bu.lvl] : [172,190];
  const x = cx-bw/2, y = cy-bh/2;

  if(ar && ar.lvl>1){
    const pw = {2:96,3:148,4:190}[ar.lvl], ph = bh*0.78;
    [x-pw-16, x+bw+16].forEach(px=>{
      c.fillStyle = 'rgba(3,212,255,0.10)'; c.fillRect(px, cy-ph/2, pw, ph);
      c.strokeStyle = SHARE_COL.accent; c.lineWidth = 2; c.strokeRect(px, cy-ph/2, pw, ph);
      c.fillStyle = SHARE_COL.accent;
      for(let a=px+9; a<px+pw-4; a+=13) for(let b=cy-ph/2+9; b<cy+ph/2-4; b+=13){ c.beginPath(); c.arc(a,b,1.8,0,7); c.fill(); }
    });
    c.strokeStyle = SHARE_COL.steel; c.lineWidth = 4;
    c.beginPath(); c.moveTo(x-16,cy); c.lineTo(x,cy); c.moveTo(x+bw,cy); c.lineTo(x+bw+16,cy); c.stroke();
  }

  c.fillStyle = SHARE_COL.panel; c.fillRect(x,y,bw,bh);
  c.fillStyle = 'rgba(108,148,200,0.55)';
  for(let a=x+12; a<x+bw-6; a+=16) for(let b=y+12; b<y+bh-6; b+=16){ c.beginPath(); c.arc(a,b,2,0,7); c.fill(); }
  c.strokeStyle = SHARE_COL.ink; c.lineWidth = 4; c.strokeRect(x,y,bw,bh);
  if(ar && ar.lvl===1){ c.fillStyle='rgba(3,212,255,0.35)'; c.fillRect(x+12,y+12,bw-24,16); }

  if(pl) artOnCanvas(c, pl.art || 'lens', cx, cy, 16 + pl.size*10);

  if(ba){
    c.strokeStyle = SHARE_COL.good; c.lineWidth = 2.4;
    for(let i=0;i<ba.lvl;i++) c.strokeRect(x+14 + i*22, y+bh-30, 16, 11);
  }
  if(po){
    c.strokeStyle = SHARE_COL.warn; c.lineWidth = 2.4;
    const sx = x+bw-18, sy = y+16;
    c.strokeRect(sx-18, sy, 18, 13);
    if(po.lvl>=2) c.strokeRect(sx-44, sy-6, 13, 26);
    if(po.lvl>=3) c.strokeRect(sx-68, sy-6, 13, 26);
    if(po.lvl>=4){ c.beginPath(); c.arc(x+22, y+bh-46, 7, 0, 7); c.stroke(); c.beginPath(); c.arc(x+42, y+bh-46, 7, 0, 7); c.stroke(); }
  }
  if(pr){
    const ny = y+bh;
    c.strokeStyle = SHARE_COL.steel; c.lineWidth = 3;
    if(pr.mass>0){
      const nw = 16+pr.mass*9;
      c.beginPath(); c.moveTo(cx-nw/2,ny); c.lineTo(cx+nw/2,ny); c.lineTo(cx+nw,ny+34); c.lineTo(cx-nw,ny+34); c.closePath(); c.stroke();
    } else { c.setLineDash([6,6]); c.strokeRect(cx-26, ny, 52, 14); c.setLineDash([]); }
  }
  if(rd){
    c.strokeStyle = rd.lvl>=5 ? SHARE_COL.accent : SHARE_COL.ink; c.lineWidth = 3;
    if(rd.lvl<=2){ c.beginPath(); c.moveTo(x+18,y); c.lineTo(x-24,y-58); c.stroke(); }
    else if(rd.lvl<=4){ c.beginPath(); c.moveTo(x+6,y-8); c.quadraticCurveTo(x+40,y-66,x+74,y-8); c.stroke();
      c.beginPath(); c.moveTo(x+40,y-8); c.lineTo(x+40,y-38); c.stroke(); }
    else { c.beginPath(); c.arc(x+36,y-36,14,0,7); c.stroke(); c.beginPath(); c.moveTo(x+36,y-50); c.lineTo(x+36,y-80); c.stroke(); }
  }
}

function markCheck(c, x, y, col){
  c.strokeStyle = col; c.lineWidth = 4; c.lineCap = 'round'; c.lineJoin = 'round';
  c.beginPath(); c.moveTo(x, y+2); c.lineTo(x+8, y+11); c.lineTo(x+22, y-8); c.stroke();
}
function markCross(c, x, y, col){
  c.strokeStyle = col; c.lineWidth = 4; c.lineCap = 'round';
  c.beginPath(); c.moveTo(x+1, y-7); c.lineTo(x+19, y+11);
  c.moveTo(x+19, y-7); c.lineTo(x+1, y+11); c.stroke();
}

const SVG_COLORS = {'--accent':'#03d4ff','--steel':'#6c94c8','--ink':'#f2f6fc','--panel':'#0a0d16',
  '--warn':'#ffb547','--good':'#3ee0a1','--bad':'#ff6b7f','--line':'#1e2740','--chip':'#10141f','--muted':'#93a3bf'};

function craftImage(){
  let svg = satSVG()
    .replace('<svg class="sat"', '<svg xmlns="http://www.w3.org/2000/svg" width="800" height="580"')
    .replace(/var\((--[a-z]+)\)/g, (m, v) => SVG_COLORS[v] || '#ffffff');
  return new Promise(res=>{
    const img = new Image();
    img.onload = ()=>res(img); img.onerror = ()=>res(null);
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}

function shareCanvas(craft){
  const W = 1080, H = 1350, c = document.createElement('canvas').getContext('2d');
  c.canvas.width = W; c.canvas.height = H;
  const m = S.m, rows = evaluate(), parts = PARTS();
  c.fillStyle = SHARE_COL.bg; c.fillRect(0,0,W,H);
  c.fillStyle = 'rgba(29,49,86,0.85)';
  for(let a=12; a<W; a+=26) for(let b=12; b<H; b+=26){ c.beginPath(); c.arc(a,b,1.6,0,7); c.fill(); }

  c.textBaseline = 'alphabetic';
  c.fillStyle = SHARE_COL.accent; c.font = "500 24px Geist Mono, monospace";
  c.fillText('PIXXEL MISSION BUILDER', 80, 104);
  if(LOGO_IMG.complete && LOGO_IMG.naturalWidth){
    const lw = 168, lh = lw*LOGO_IMG.naturalHeight/LOGO_IMG.naturalWidth;
    c.drawImage(LOGO_IMG, W-80-lw, 86-lh, lw, lh);
    c.fillStyle = SHARE_COL.muted; c.font = "400 19px Geist, sans-serif";
    c.textAlign = 'right';
    c.fillText('The Planetary Infrastructure Company.', W-80, 112);
    c.textAlign = 'left';
  }
  c.fillStyle = SHARE_COL.ink;
  let tSize = 58, title = satLabel();
  do { c.font = `800 ${tSize}px NewBlack, sans-serif`; tSize -= 2; } while(c.measureText(title).width > W-160 && tSize > 30);
  c.fillText(title, 80, 180);

  if(craft){ const cw = 620, ch = cw * 290/400; c.drawImage(craft, (W-cw)/2, 455-ch/2, cw, ch); }
  else drawCraft(c, W/2, 455, parts);

  const VAL = {
    orbit: parts.o && parts.o.name,
    sensing: parts.pl && parts.pl.name,
    point: parts.po && parts.po.name,
    comms: parts.rd && parts.rd.name,
    power: parts.ar && parts.ba ? `${parts.ar.name} + ${parts.ba.name.toLowerCase()}` : null,
    bus: parts.bu && parts.bu.name,
    prop: parts.pr && (parts.pr.mass>0 ? `${parts.pr.name} propulsion` : 'No propulsion')
  };
  let y = 706;
  Object.keys(VAL).forEach(k=>{
    const row = rows.find(r=>r.key===k), col = row && row.fit ? FITCOL[row.fit] : SHARE_COL.muted;
    if(row && row.fit === 'strong') markCheck(c, 80, y-9, col); else markCross(c, 80, y-9, col);
    c.fillStyle = col;
    let size = 36, v = VAL[k] || '—';
    do { c.font = `700 ${size}px NewBlack, sans-serif`; size -= 2; } while(c.measureText(v).width > W-220 && size > 18);
    c.fillText(v, 136, y);
    y += 64;
  });

  y += 14;
  c.fillStyle = SHARE_COL.muted; c.font = "500 22px Geist Mono, monospace";
  c.fillText('BUDGET USED', 80, y);
  c.fillStyle = SHARE_COL.ink; c.font = '800 48px NewBlack, sans-serif';
  c.fillText(`${spent()} / ${m.budget} Pixxel Credits`, 80, y+60);

  c.fillStyle = SHARE_COL.steel; c.font = '400 23px Geist, sans-serif';
  c.fillText('There is no perfect satellite. Only the one that makes sense for the mission.', 80, H-72);
  return c.canvas;
}

async function drawPreview(){
  const img = document.getElementById('preview'); if(!img) return;
  try{
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    const el = document.getElementById('preview'); if(!el) return;
    const craft = await craftImage();
    el.src = shareCanvas(craft).toDataURL('image/png');
  }catch(e){}
}

function shareFilename(){
  const title = S.m.name.replace(/\s*satellite$/i,'')
    .split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
  return `Your ${title} Satellite.png`;
}

async function shareSatellite(btn){
  const holder = document.getElementById('sharebox');
  const say = msg => { if(holder) holder.innerHTML = msg ? `<p class="muted" style="font-size:14px;margin:0">${msg}</p>` : ''; };
  btn.disabled = true; const original = btn.textContent; btn.textContent = 'Building image…';
  try{
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    const craft = await craftImage();
    const canvas = shareCanvas(craft);
    const blob = await new Promise(res=>canvas.toBlob(res,'image/png'));
    const name = shareFilename();
    say('');

    // 1. the host's own save dialog, when the viewer has it
    try{
      const downloads = (window.claude && typeof window.claude.use === 'function') ? await window.claude.use('downloads') : null;
      if(downloads){
        try{ await downloads.save({filename:name, data:blob}); say('Saved.'); return; }
        catch(err){ if(err && err.code === 'declined'){ say(''); return; } }
      }
    }catch(e){}

    // 2. the device share sheet, mostly phones
    try{
      const file = new File([blob], name, {type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:name});
        say(''); return;
      }
    }catch(e){ if(e && e.name === 'AbortError'){ say(''); return; } }

    // 3. a plain download link
    try{
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name; a.rel = 'noopener';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      say('If nothing downloaded, press and hold the image above, or right-click it, to save it.');
      return;
    }catch(e){}

    // 4. open it in its own tab to save from there
    try{
      const w = window.open(); 
      if(w){ w.document.write(`<title>${name}</title><img src="${canvas.toDataURL('image/png')}" style="max-width:100%">`); say('Opened in a new tab. Press and hold or right-click to save it.'); return; }
    }catch(e){}

    say('Press and hold the image above, or right-click it, to save it.');
  }catch(e){
    say('Something went wrong building the image. Press and hold the image above to save it instead.');
  } finally { btn.disabled = false; btn.textContent = original; }
}

function renderLaunch(){
  const m = S.m, rows = evaluate(), {pl,o,po,rd,pr} = PARTS();
  const bad = rows.filter(r=>r.fit==='problem'), soft = rows.filter(r=>r.fit==='challenging'||r.fit==='possible');
  const overBudget = bad.some(r=>r.key==='budget');
  const verdict = overBudget ? 'You\u2019re over budget. Time to raise funding?'
    : bad.length ? 'Close, but not quite mission-ready.'
    : soft.length ? 'Your mission is ready, but with trade-offs.' : 'Your mission is ready.';
  const can = [...m.can];
  if(left()>=0) can.push('Operate within its available budget');
  const tradeoff = (bad[0]||soft[0]);
  app.innerHTML = `
  <div class="grid">
    <section class="panel">
      <div class="cleared">${verdict}</div>
      <p class="sattype">${satLabel()}</p>
      <p class="spend mono ${overBudget?'over':''}">${spent()} / ${m.budget} Pixxel Credits spent</p>
      ${bad.length?`<p>This design has a problem with ${bad.map(r=>r.label.toLowerCase()).join(' and ')}, so it would not fly as it stands.</p>`:`<h2 style="font-size:26px;margin-top:24px">Your spacecraft can</h2><ul class="can">${can.map(c=>`<li>${c}</li>`).join('')}</ul>`}
      ${tradeoff?`<h2 style="font-size:26px">Your biggest trade-off</h2><p>${tradeoff.note||'This part of the spacecraft is not what the mission would usually ask for.'}</p>`:`<p>Every system on this spacecraft suits the mission, and it came in within budget.</p>`}


    </section>
    <aside class="side panel"><div class="previewbox"><img id="preview" alt="Share card for your satellite design"></div>
      <p class="sharecta">Your mission blueprint. Save it, post it, and see who can build a better satellite.</p>
      <div class="nav sharenav">
        <button class="btn" id="share">Share your satellite</button>
        <button class="btn ghost" id="another">Try another mission</button>
      </div>
      <div id="sharebox" class="sharebox"></div></aside>
  </div>
  <footer class="endfoot panel">
    <div class="endfoot-brand">
      <a href="https://www.pixxel.space/" target="_blank" rel="noopener"><img src="${LOGO}" alt="Pixxel" class="mark big"></a>
      <span class="endfoot-div" aria-hidden="true"></span>
      <p class="endfoot-tag">The Planetary Infrastructure Company.</p>
    </div>
    <h2 class="closer">A satellite is a set of trade-offs that agree with each other.</h2>
    <p class="lede">Real spacecraft engineering is far more complex, but the principle is the same: many systems, working together around a mission. Pixxel builds the spacecraft, sensors and software that make those missions possible.</p>
    <a class="btn" href="https://www.pixxel.space/" target="_blank" rel="noopener">Visit pixxel.space</a>
  </footer>`;
  drawPreview();
  document.getElementById('share').onclick=(e)=>shareSatellite(e.currentTarget);
  document.getElementById('another').onclick=()=>{S={screen:'missions',m:null,step:0,picks:{},open:null};render();window.scrollTo({top:0});};
}
render();
</script>
